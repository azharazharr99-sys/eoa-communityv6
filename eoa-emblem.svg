<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#1492e6" />
      <stop offset="100%" stop-color="#5458f7" />
    </linearGradient>

    <!-- Shadow/Depth filters for subtle layering -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGradient)" />

  <!-- Background Abstract Geometric Shapes / Panels -->
  <!-- Top Left Block -->
  <polygon points="198,0 499,198 499,485 145,485 145,198" fill="#1fc8e3" opacity="0.4" />
  <!-- Top Right Spike/Shape -->
  <polygon points="613,67 662,298 565,245" fill="#29b6f6" opacity="0.5" />
  
  <!-- Bottom Right Block -->
  <polygon points="545,515 855,515 855,1000 545,1000" fill="#7289da" opacity="0.6" />
  <polygon points="855,750 1000,750 1000,1000 855,1000" fill="#3f51b5" opacity="0.4" />

  <!-- Bottom Left Spike/Shape -->
  <polygon points="365,650 415,875 365,775" fill="#00bcd4" opacity="0.6" />

  <!-- Central Main Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Top-Left/Main Upper White Component -->
    <path d="M 170,355 
             C 210,320 260,240 310,210 
             C 450,175 620,225 720,380 
             C 745,420 745,475 720,510 
             C 710,525 680,525 670,510 
             C 630,450 560,370 450,370 
             C 380,370 365,415 365,460 
             L 365,580 
             L 515,580 
             L 515,480 
             L 600,480 
             L 600,600 
             L 320,600 
             C 275,600 240,560 220,530 
             C 175,460 150,390 170,355 Z" 
          fill="#f4f7fc" />

    <!-- Lower/Inner Complementary Component -->
    <path d="M 830,590 
             C 790,625 740,705 690,735 
             C 550,770 380,720 280,565 
             C 255,525 255,470 280,435 
             C 290,420 320,420 330,435 
             C 370,495 440,575 550,575 
             C 620,575 635,530 635,485 
             L 635,365 
             L 485,365 
             L 485,465 
             L 400,465 
             L 400,345 
             L 680,345 
             C 725,345 760,385 780,415 
             C 825,485 850,555 830,590 Z" 
          fill="#ffffff" />
  </g>
</svg>
